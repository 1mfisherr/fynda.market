name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deploy runs after these, so red blocks it. See docs/ARCHITECTURE.md.
jobs:
  verify:
    name: Build and guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Guardrails
        run: npm run guardrails
