name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deploy runs after these, so red blocks it. See docs/ARCHITECTURE.md.
jobs:
  verify:
    name: Build and guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      # functions/ is excluded from the site's tsconfig, for a good reason: a
      # Pages Function needs Cloudflare's globals and must not inherit Astro's
      # DOM lib. The consequence was that the six files receiving everything a
      # visitor types were the only unchecked code in the repo.
      - name: Typecheck the functions
        run: npm run check:functions

      # The digest is the one thing here that sends wrong information to real
      # people and cannot be recalled. The tests existed and CI was not
      # running them.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Guardrails
        run: npm run guardrails

  schema:
    name: Schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema and run tests
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT

          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'create database fynda_test template template0'

          # Supabase ships three roles that a plain Postgres does not have, and
          # the migrations grant to all three. Creating them here means CI runs
          # the real GRANT statements instead of skipping past them, so a grant
          # naming a table that no longer exists fails the build.
          psql \
            -h localhost \
            -U postgres \
            -d fynda_test \
            -v ON_ERROR_STOP=1 \
            -c "do \$\$ begin
                  if not exists (select 1 from pg_roles where rolname = 'anon') then
                    create role anon nologin;
                  end if;
                  if not exists (select 1 from pg_roles where rolname = 'authenticated') then
                    create role authenticated nologin;
                  end if;
                  if not exists (select 1 from pg_roles where rolname = 'service_role') then
                    create role service_role nologin bypassrls;
                  end if;
                end \$\$"

          while IFS= read -r -d '' migration; do
            psql \
              -h localhost \
              -U postgres \
              -d fynda_test \
              -v ON_ERROR_STOP=1 \
              -f "$migration" 2>&1 | tee -a "$output_file"
          done < <(find supabase/migrations -type f -name '*.sql' -print0 | sort -z)

          psql \
            -h localhost \
            -U postgres \
            -d fynda_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/schema_test.sql 2>&1 | tee -a "$output_file"

          if grep -Eq '\b(FAIL|ERROR)\b' "$output_file"; then
            echo 'Schema output contains FAIL or ERROR.'
            exit 1
          fi
